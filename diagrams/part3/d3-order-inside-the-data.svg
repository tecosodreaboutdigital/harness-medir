<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-label="Where the order enters inside the data: a trusted zone and an untrusted zone converge into a single stream of symbols">
<style>
text{font-family:"Aptos","Segoe UI",Arial,sans-serif}
.svg-cap{font-size:8.5px;letter-spacing:.16em;fill:#8a887f}
.svg-lbl{font-size:10px;letter-spacing:.14em;fill:#1b1b19}
.svg-sub{font-size:8.5px;fill:#8a887f}
.svg-ttl{font-size:11px;letter-spacing:.16em;fill:#1b1b19}
</style>
<defs><marker id="d3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 2 L8 5 L1 8" fill="none" stroke="#1b1b19" stroke-width="1"/></marker></defs>

<text class="svg-ttl" x="350" y="24" text-anchor="middle">WHERE THE ORDER ENTERS INSIDE THE DATA</text>

<rect x="30" y="52" width="260" height="150" fill="none" stroke="#c9c7bf" stroke-width=".7" stroke-dasharray="2,3"/>
<text class="svg-lbl" x="160" y="70" text-anchor="middle">TRUSTED ZONE</text>
<rect x="50" y="84" width="220" height="36" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-sub" x="160" y="106" text-anchor="middle">Task contract</text>
<rect x="50" y="138" width="220" height="36" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-sub" x="160" y="160" text-anchor="middle">Own guides and skills</text>

<rect x="410" y="34" width="260" height="210" fill="none" stroke="#c9c7bf" stroke-width=".7" stroke-dasharray="2,3"/>
<text class="svg-lbl" x="540" y="52" text-anchor="middle">UNTRUSTED ZONE</text>
<rect x="430" y="64" width="220" height="32" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-sub" x="540" y="84" text-anchor="middle">Email, PDF, web page</text>
<rect x="430" y="104" width="220" height="32" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-sub" x="540" y="124" text-anchor="middle">External system response</text>
<rect x="430" y="144" width="220" height="32" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-sub" x="540" y="164" text-anchor="middle">Third-party skill</text>
<rect x="430" y="184" width="220" height="32" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-sub" x="540" y="204" text-anchor="middle">Document sent by a customer</text>

<line x1="270" y1="120" x2="330" y2="292" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d3-arrow)"/>
<line x1="270" y1="174" x2="335" y2="292" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d3-arrow)"/>
<line x1="430" y1="96" x2="368" y2="292" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d3-arrow)"/>
<line x1="430" y1="136" x2="363" y2="292" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d3-arrow)"/>
<line x1="430" y1="176" x2="358" y2="292" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d3-arrow)"/>
<line x1="430" y1="216" x2="353" y2="292" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d3-arrow)"/>

<rect x="190" y="294" width="320" height="58" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="350" y="316" text-anchor="middle">SINGLE STREAM OF SYMBOLS</text>
<text class="svg-sub" x="350" y="332" text-anchor="middle">no reliable marking separates</text>
<text class="svg-sub" x="350" y="344" text-anchor="middle">command from data</text>

<line x1="350" y1="352" x2="350" y2="378" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d3-arrow)"/>
<rect x="290" y="380" width="120" height="36" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="350" y="402" text-anchor="middle">PROPOSED ACTION</text>

<text class="svg-cap" x="350" y="430" text-anchor="middle">THE BOUNDARY EXISTS IN YOUR DIAGRAM, NOT INSIDE THE MODEL</text>
</svg>
