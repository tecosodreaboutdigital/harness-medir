<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" role="img" aria-label="The separation of powers: the model proposes, the policy authorizes, the tool executes, the record witnesses">
<style>
text{font-family:"Aptos","Segoe UI",Arial,sans-serif}
.svg-cap{font-size:8.5px;letter-spacing:.16em;fill:#8a887f}
.svg-lbl{font-size:10px;letter-spacing:.14em;fill:#1b1b19}
.svg-sub{font-size:8.5px;fill:#8a887f}
.svg-ttl{font-size:11px;letter-spacing:.16em;fill:#1b1b19}
</style>
<defs><marker id="d1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 2 L8 5 L1 8" fill="none" stroke="#1b1b19" stroke-width="1"/></marker></defs>

<text class="svg-ttl" x="350" y="24" text-anchor="middle">THE SEPARATION OF POWERS</text>

<rect x="15" y="138" width="95" height="44" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="62" y="157" text-anchor="middle">MODEL</text>
<text class="svg-sub" x="62" y="171" text-anchor="middle">proposes</text>
<line x1="110" y1="160" x2="143" y2="160" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d1-arrow)"/>

<polygon points="145,160 215,106 285,160 215,214" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="215" y="157" text-anchor="middle">POLICY</text>
<text class="svg-sub" x="215" y="171" text-anchor="middle">authorizes</text>

<line x1="285" y1="160" x2="358" y2="66" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d1-arrow)"/>
<text class="svg-sub" x="332" y="100" text-anchor="middle">allows</text>
<line x1="285" y1="160" x2="358" y2="160" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d1-arrow)"/>
<text class="svg-sub" x="332" y="150" text-anchor="middle">requires approval</text>
<line x1="285" y1="160" x2="358" y2="254" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d1-arrow)"/>
<text class="svg-sub" x="332" y="220" text-anchor="middle">denies</text>

<rect x="360" y="45" width="110" height="42" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="415" y="63" text-anchor="middle">TOOL</text>
<text class="svg-sub" x="415" y="77" text-anchor="middle">executes</text>

<rect x="360" y="139" width="110" height="42" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="415" y="157" text-anchor="middle">HUMAN</text>
<text class="svg-sub" x="415" y="171" text-anchor="middle">decides</text>

<rect x="360" y="233" width="110" height="42" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="415" y="251" text-anchor="middle">BLOCK</text>
<text class="svg-sub" x="415" y="265" text-anchor="middle">with reason</text>

<line x1="415" y1="139" x2="415" y2="89" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d1-arrow)"/>
<text class="svg-sub" x="455" y="117" text-anchor="middle">approves</text>
<line x1="415" y1="181" x2="415" y2="231" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d1-arrow)"/>
<text class="svg-sub" x="452" y="209" text-anchor="middle">refuses</text>

<path d="M560,144 a55,11 0 0 1 110,0 v42 a55,11 0 0 1 -110,0 z" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<path d="M560,144 a55,11 0 0 0 110,0" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="615" y="172" text-anchor="middle">RECORD</text>
<text class="svg-sub" x="615" y="186" text-anchor="middle">witnesses</text>

<line x1="470" y1="66" x2="558" y2="148" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d1-arrow)"/>
<line x1="470" y1="160" x2="558" y2="168" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d1-arrow)"/>
<line x1="470" y1="254" x2="558" y2="188" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d1-arrow)"/>

<text class="svg-cap" x="350" y="300" text-anchor="middle">THE MODEL PROPOSES · THE POLICY AUTHORIZES · THE TOOL EXECUTES · THE RECORD WITNESSES</text>
</svg>
