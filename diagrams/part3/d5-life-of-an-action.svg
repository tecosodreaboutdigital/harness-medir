<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" role="img" aria-label="The life of an action with an external effect, from proposal to a minimum six-month retention">
<title>The life of an action with an external effect, from proposal to a minimum six-month retention</title>
<desc>A sequence across model, policy, human, tool and record: the model proposes, the policy logs the class and asks for named approval, the human approves, the policy authorises, the tool checks whether the action is safe to retry, the reversal point is logged before execution, the tool executes and the result is observed, then result and cost are logged under a minimum six-month retention.</desc>
<style>
text{font-family:"Aptos","Segoe UI",Arial,sans-serif}
.svg-cap{font-size:8.5px;letter-spacing:.16em;fill:#8a887f}
.svg-lbl{font-size:10px;letter-spacing:.14em;fill:#1b1b19}
.svg-sub{font-size:8.5px;fill:#8a887f}
.svg-ttl{font-size:11px;letter-spacing:.16em;fill:#1b1b19}
.svg-note{font-size:8px;letter-spacing:.12em;fill:#1b1b19;font-style:italic}
</style>
<defs>
  <marker id="d5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 2 L8 5 L1 8" fill="none" stroke="#1b1b19" stroke-width="1"/></marker>
  <marker id="d5-arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 2 L8 5 L1 8" fill="none" stroke="#8a887f" stroke-width="1"/></marker>
</defs>

<text class="svg-ttl" x="350" y="16" text-anchor="middle">THE LIFE OF AN ACTION WITH AN EXTERNAL EFFECT</text>

<g>
  <rect x="15" y="26" width="90" height="28" fill="none" stroke="#1b1b19" stroke-width=".7"/>
  <text class="svg-lbl" x="60" y="44" text-anchor="middle">MODEL</text>
  <rect x="155" y="26" width="90" height="28" fill="none" stroke="#1b1b19" stroke-width=".7"/>
  <text class="svg-lbl" x="200" y="44" text-anchor="middle">POLICY</text>
  <rect x="295" y="26" width="90" height="28" fill="none" stroke="#1b1b19" stroke-width=".7"/>
  <text class="svg-lbl" x="340" y="44" text-anchor="middle">HUMAN</text>
  <rect x="435" y="26" width="90" height="28" fill="none" stroke="#1b1b19" stroke-width=".7"/>
  <text class="svg-lbl" x="480" y="44" text-anchor="middle">TOOL</text>
  <rect x="575" y="26" width="90" height="28" fill="none" stroke="#1b1b19" stroke-width=".7"/>
  <text class="svg-lbl" x="620" y="44" text-anchor="middle">RECORD</text>
</g>

<line x1="60" y1="54" x2="60" y2="496" stroke="#c9c7bf" stroke-width=".7" stroke-dasharray="2,3"/>
<line x1="200" y1="54" x2="200" y2="496" stroke="#c9c7bf" stroke-width=".7" stroke-dasharray="2,3"/>
<line x1="340" y1="54" x2="340" y2="496" stroke="#c9c7bf" stroke-width=".7" stroke-dasharray="2,3"/>
<line x1="480" y1="54" x2="480" y2="496" stroke="#c9c7bf" stroke-width=".7" stroke-dasharray="2,3"/>
<line x1="620" y1="54" x2="620" y2="496" stroke="#c9c7bf" stroke-width=".7" stroke-dasharray="2,3"/>

<line x1="60" y1="80" x2="197" y2="80" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d5-arrow)"/>
<text class="svg-sub" x="130" y="75" text-anchor="middle">proposes action with external effect</text>

<line x1="200" y1="120" x2="617" y2="120" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d5-arrow)"/>
<text class="svg-sub" x="410" y="115" text-anchor="middle">logs proposal and action class</text>

<line x1="200" y1="160" x2="337" y2="160" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d5-arrow)"/>
<text class="svg-sub" x="270" y="155" text-anchor="middle">irreversible class, requires named approval</text>

<line x1="340" y1="200" x2="617" y2="200" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d5-arrow)"/>
<text class="svg-sub" x="480" y="195" text-anchor="middle">approves, with identification</text>

<line x1="200" y1="240" x2="477" y2="240" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d5-arrow)"/>
<text class="svg-sub" x="340" y="235" text-anchor="middle">authorises execution</text>

<path d="M480,262 C 520,262 520,278 480,278" fill="none" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d5-arrow)"/>
<text class="svg-sub" x="516" y="274" text-anchor="start">safe to retry? key</text>

<line x1="480" y1="330" x2="617" y2="330" stroke="#1b1b19" stroke-width="1.3" marker-end="url(#d5-arrow)"/>
<text class="svg-sub" x="548" y="318" text-anchor="middle">logs reversal point</text>
<text class="svg-note" x="548" y="344" text-anchor="middle">BEFORE EXECUTION, NOT AFTER</text>
<rect x="472" y="308" width="152" height="44" fill="none" stroke="#1b1b19" stroke-width=".9"/>

<path d="M480,366 C 520,366 520,384 480,384" fill="none" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d5-arrow)"/>
<text class="svg-sub" x="516" y="379" text-anchor="start">executes</text>

<path d="M480,396 C 520,396 520,412 480,412" fill="none" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d5-arrow)"/>
<text class="svg-sub" x="516" y="407" text-anchor="start">executed / observed</text>

<line x1="480" y1="440" x2="617" y2="440" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d5-arrow)"/>
<text class="svg-sub" x="548" y="435" text-anchor="middle">logs result and cost</text>

<path d="M620,470 C 655,470 655,486 620,486" fill="none" stroke="#8a887f" stroke-width=".7" stroke-dasharray="2,3" marker-end="url(#d5-arrow-open)"/>
<text class="svg-sub" x="695" y="502" text-anchor="end">minimum six-month retention</text>
</svg>
