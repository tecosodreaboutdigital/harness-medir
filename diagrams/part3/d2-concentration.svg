<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" role="img" aria-label="The failure mode: concentration, when one system proposes, authorizes and executes at once">
<style>
text{font-family:"Aptos","Segoe UI",Arial,sans-serif}
.svg-cap{font-size:8.5px;letter-spacing:.16em;fill:#8a887f}
.svg-lbl{font-size:10px;letter-spacing:.14em;fill:#1b1b19}
.svg-sub{font-size:8.5px;fill:#8a887f}
.svg-ttl{font-size:11px;letter-spacing:.16em;fill:#1b1b19}
</style>
<defs><marker id="d2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 2 L8 5 L1 8" fill="none" stroke="#1b1b19" stroke-width="1"/></marker></defs>

<text class="svg-ttl" x="350" y="24" text-anchor="middle">THE FAILURE MODE: CONCENTRATION</text>

<rect x="30" y="78" width="190" height="44" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="125" y="97" text-anchor="middle">MODEL</text>
<text class="svg-sub" x="125" y="111" text-anchor="middle">proposes, authorizes and executes</text>

<line x1="220" y1="100" x2="298" y2="100" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d2-arrow)"/>

<rect x="300" y="78" width="150" height="44" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="375" y="104" text-anchor="middle">EFFECT IN THE WORLD</text>

<line x1="450" y1="100" x2="560" y2="100" stroke="#8a887f" stroke-width=".7" stroke-dasharray="2,3" marker-end="url(#d2-arrow)"/>
<text class="svg-sub" x="505" y="88" text-anchor="middle">no independent record</text>

<text class="svg-sub" x="580" y="82" text-anchor="start">No trail</text>
<text class="svg-sub" x="580" y="100" text-anchor="start">No reversal</text>
<text class="svg-sub" x="580" y="118" text-anchor="start">No accountability</text>
</svg>
