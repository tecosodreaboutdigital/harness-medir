<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 344" role="img" aria-label="The agent life cycle: states, not steps, from a versioned briefing to decommissioning">
<style>
text{font-family:"Aptos","Segoe UI",Arial,sans-serif}
.svg-cap{font-size:8.5px;letter-spacing:.16em;fill:#8a887f}
.svg-lbl{font-size:10px;letter-spacing:.14em;fill:#1b1b19}
.svg-sub{font-size:8.5px;fill:#8a887f}
.svg-ttl{font-size:11px;letter-spacing:.16em;fill:#1b1b19}
</style>
<defs><marker id="d7-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 2 L8 5 L1 8" fill="none" stroke="#1b1b19" stroke-width="1"/></marker></defs>

<text class="svg-ttl" x="350" y="16" text-anchor="middle">THE AGENT LIFE CYCLE: STATES, NOT STEPS</text>

<line x1="0" y1="150" x2="13" y2="150" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d7-arrow)"/>
<rect x="15" y="128" width="115" height="44" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="72" y="146" text-anchor="middle">BRIEFING</text>
<text class="svg-sub" x="72" y="160" text-anchor="middle">versioned</text>

<rect x="175" y="128" width="115" height="44" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="233" y="154" text-anchor="middle">CERTIFIED</text>

<rect x="335" y="128" width="125" height="44" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="397" y="154" text-anchor="middle">IN OPERATION</text>

<rect x="335" y="240" width="125" height="44" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="397" y="266" text-anchor="middle">UNDER REVIEW</text>

<rect x="175" y="240" width="115" height="44" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="233" y="266" text-anchor="middle">SUSPENDED</text>

<rect x="545" y="184" width="140" height="44" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="615" y="210" text-anchor="middle">DECOMMISSIONED</text>

<line x1="55" y1="172" x2="55" y2="212" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d7-arrow)"/>
<text class="svg-sub" x="55" y="224" text-anchor="middle">verdict: do not build</text>

<line x1="130" y1="150" x2="173" y2="150" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d7-arrow)"/>
<text class="svg-sub" x="152" y="140" text-anchor="middle">reviewer approves tier</text>

<line x1="290" y1="150" x2="333" y2="150" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d7-arrow)"/>
<text class="svg-sub" x="312" y="140" text-anchor="middle">owner activates</text>

<line x1="397" y1="172" x2="397" y2="238" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d7-arrow)"/>
<text class="svg-sub" x="465" y="205" text-anchor="middle">indicator fires</text>

<line x1="424" y1="240" x2="424" y2="174" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d7-arrow)"/>
<text class="svg-sub" x="480" y="245" text-anchor="middle">back to normal</text>

<line x1="335" y1="262" x2="292" y2="262" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d7-arrow)"/>
<text class="svg-sub" x="312" y="252" text-anchor="middle">risk confirmed</text>

<line x1="336" y1="168" x2="248" y2="238" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d7-arrow)"/>
<text class="svg-sub" x="280" y="195" text-anchor="middle">incident</text>

<line x1="215" y1="240" x2="215" y2="174" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d7-arrow)"/>
<text class="svg-sub" x="150" y="205" text-anchor="middle">correction, revalidated</text>

<path d="M292,140 C 340,78 470,78 543,190" fill="none" stroke="#1b1b19" stroke-width="1.3" marker-end="url(#d7-arrow)"/>
<text class="svg-sub" x="400" y="80" text-anchor="middle">validity expired without renewal</text>

<line x1="460" y1="150" x2="543" y2="196" stroke="#1b1b19" stroke-width="1.3" marker-end="url(#d7-arrow)"/>
<text class="svg-sub" x="500" y="170" text-anchor="middle">no execution in the period</text>

<path d="M290,278 C 415,335 495,275 543,222" fill="none" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d7-arrow)"/>
<text class="svg-sub" x="415" y="312" text-anchor="middle">certifier's decision</text>

<line x1="685" y1="206" x2="698" y2="206" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d7-arrow)"/>

<text class="svg-cap" x="350" y="330" text-anchor="middle">THE TWO TRANSITIONS NOBODY IMPLEMENTS ARE THE HEAVIER LINES</text>
</svg>
