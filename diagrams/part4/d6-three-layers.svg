<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-label="The three layers of the framework, and only three, crossed by one shared ruler: build, operation, governance">
<style>
text{font-family:"Aptos","Segoe UI",Arial,sans-serif}
.svg-cap{font-size:8.5px;letter-spacing:.16em;fill:#8a887f}
.svg-lbl{font-size:10px;letter-spacing:.14em;fill:#1b1b19}
.svg-sub{font-size:8.5px;fill:#8a887f}
.svg-ttl{font-size:11px;letter-spacing:.16em;fill:#1b1b19}
</style>
<defs><marker id="d6-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 2 L8 5 L1 8" fill="none" stroke="#1b1b19" stroke-width="1"/></marker></defs>

<text class="svg-ttl" x="350" y="20" text-anchor="middle">THREE LAYERS, AND ONLY THREE</text>

<rect x="180" y="34" width="360" height="90" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="360" y="58" text-anchor="middle">GOVERNANCE · AGENT OFFICE</text>
<text class="svg-sub" x="360" y="76" text-anchor="middle">How many exist, who owns each one,</text>
<text class="svg-sub" x="360" y="90" text-anchor="middle">which ones still pay for themselves</text>

<line x1="360" y1="154" x2="360" y2="128" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d6-arrow)"/>

<rect x="180" y="156" width="360" height="90" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="360" y="180" text-anchor="middle">OPERATION · SEPARATION OF POWERS</text>
<text class="svg-sub" x="360" y="198" text-anchor="middle">What it can do,</text>
<text class="svg-sub" x="360" y="212" text-anchor="middle">and who answers for it</text>

<line x1="360" y1="276" x2="360" y2="250" stroke="#1b1b19" stroke-width=".7" marker-end="url(#d6-arrow)"/>

<rect x="180" y="278" width="360" height="90" fill="none" stroke="#1b1b19" stroke-width=".7"/>
<text class="svg-lbl" x="360" y="302" text-anchor="middle">BUILD · THE MEDIR CYCLE</text>
<text class="svg-sub" x="360" y="320" text-anchor="middle">How you build</text>
<text class="svg-sub" x="360" y="334" text-anchor="middle">a reliable agent</text>

<rect x="70" y="30" width="46" height="342" fill="none" stroke="#c9c7bf" stroke-width=".7" stroke-dasharray="2,3"/>
<text class="svg-lbl" x="93" y="200" text-anchor="middle" transform="rotate(-90 93 200)">TIERS N0 TO N3</text>

<line x1="116" y1="79" x2="178" y2="79" stroke="#c9c7bf" stroke-width=".7" stroke-dasharray="2,3"/>
<line x1="116" y1="201" x2="178" y2="201" stroke="#c9c7bf" stroke-width=".7" stroke-dasharray="2,3"/>
<line x1="116" y1="323" x2="178" y2="323" stroke="#c9c7bf" stroke-width=".7" stroke-dasharray="2,3"/>

<text class="svg-cap" x="350" y="390" text-anchor="middle">THE ONE RULER SHARED ACROSS ALL THREE LAYERS</text>
</svg>
